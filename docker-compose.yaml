version: "3.8"

# Assumes Postgres and Kafka are already running elsewhere (an existing
# server/cluster) -- this compose file only builds/runs the app + frontend.
# Point the vars below (via a root-level .env, which Compose auto-loads)
# at those existing services. If they run on the Docker host itself, use
# host.docker.internal instead of localhost so the container can reach them.

services:
  webhook-middleware:
    build:
      context: .
      dockerfile: deployments/Dockerfile
    environment:
      HTTP_PORT: "${HTTP_PORT:-8090}"
      USE_REST: "true"
      USE_CRON_SCHEDULER: "true"
      OTEL_TRACING_HOST: "${OTEL_TRACING_HOST:-jaeger:4317}"
      SQL_DB_READ_DSN: "${SQL_DB_READ_DSN:-postgres://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT:-5432}/${DB_NAME}?sslmode=${DB_SSLMODE:-disable}&TimeZone=Asia/Jakarta}"
      SQL_DB_WRITE_DSN: "${SQL_DB_WRITE_DSN:-postgres://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT:-5432}/${DB_NAME}?sslmode=${DB_SSLMODE:-disable}&TimeZone=Asia/Jakarta}"
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_COMMON_TOPIC: ${KAFKA_COMMON_TOPIC:-webhook_gateway_events}
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-webhook_gateway}
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:-}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      DASHBOARD_AUTH_SECRET: ${DASHBOARD_AUTH_SECRET:-}
      DASHBOARD_SESSION_TTL: ${DASHBOARD_SESSION_TTL:-24h}
    ports:
      - "${HTTP_PORT:-8090}:8090"
    networks:
      - default
      - stack_stack

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8090"
    depends_on:
      - webhook-middleware
    ports:
      - "3010:3000"

networks:
  default:
  stack_stack:
    external: true
